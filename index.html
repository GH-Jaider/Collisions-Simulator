<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Collisions · a physics laboratory</title>
    <meta
      name="description"
      content="An interactive rigid-body laboratory. Collisions, conservation and gravity, with the equations on screen."
    />
    <meta name="theme-color" content="#0c0c12" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script>
      // Runs before first paint so a stored theme never flashes the default
      // palette on the way in. Deliberately tiny and dependency-free.
      try {
        var t = localStorage.getItem("collisions.theme");
        // Checked against the known set: a theme that has since been renamed
        // would otherwise leave the page on an attribute nothing styles and
        // no swatch matches.
        if (["matte", "ember", "paper"].indexOf(t) >= 0) {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <div class="frame">
      <header class="masthead">
        <div class="identity">
          <span class="wordmark">COLLISIONS</span>
          <span class="subtitle">rigid-body lab</span>
        </div>

        <nav class="channels" id="channels" aria-label="Experiments"></nav>

        <div class="masthead-end">
          <div
            class="themes"
            id="themes"
            role="group"
            aria-label="Colour theme"
          >
            <span class="themes-label">theme</span>
          </div>
          <button class="ghost-button" id="about-button" type="button">
            <span class="key-cap">?</span>how it works
          </button>
        </div>
      </header>

      <div class="stage-head">
        <h1 class="stage-title" id="lab-title"></h1>
        <p class="stage-blurb" id="lab-blurb"></p>
      </div>

      <main class="bench">
        <section class="stage" id="stage">
          <div class="viewport" id="viewport">
            <span class="box-title" id="viewport-title">simulation</span>
            <span class="box-note" id="scale-note"></span>
            <canvas id="canvas"></canvas>
          </div>

          <div class="console">
            <div class="transport">
              <button
                class="transport-button primary"
                id="play"
                type="button"
                aria-label="Play or pause"
              >
                <span class="glyph" id="play-glyph">❚❚</span
                ><span id="play-label">pause</span>
              </button>
              <button
                class="transport-button"
                id="step"
                type="button"
                title="Advance one frame"
              >
                <span class="glyph">▶❚</span><span>step</span>
              </button>
              <button
                class="transport-button"
                id="reset"
                type="button"
                title="Restart the experiment"
              >
                <span class="glyph">↺</span><span>restart</span>
              </button>
            </div>

            <div class="rate">
              <span class="rate-label">speed</span>
              <div class="rate-options" id="rate-options"></div>
            </div>

            <div class="toggles" id="toggles"></div>
          </div>
        </section>

        <aside class="readout" id="readout" aria-label="Measurements"></aside>
      </main>

      <footer class="statusbar">
        <span class="hint"><b>space</b> play/pause</span>
        <span class="hint"><b>.</b> step</span>
        <span class="hint"><b>r</b> restart</span>
        <span class="hint"><b>1-4</b> experiment</span>
        <span class="hint"><b>?</b> help</span>
        <span class="statusbar-end" id="status-state">running</span>
      </footer>
    </div>

    <dialog class="about" id="about">
      <article class="about-body">
        <header>
          <h2>how it works</h2>
          <button class="ghost-button" id="about-close" type="button">
            esc
          </button>
        </header>
        <div id="about-content"></div>
      </article>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
